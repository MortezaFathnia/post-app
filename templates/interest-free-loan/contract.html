<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قرارداد قرض الحسنه</title>
  <link rel="stylesheet" href="../shared/template.css">
</head>
<body class="loan-contract">
  <!--
    Interest-free loan contract template.
    Keep all presentation rules in ../shared/template.css.
    Replace the page-content placeholders with the exact text and layout
    from the source contract PDF; do not add a template-specific stylesheet.
  -->
  <main class="contract-document">
    <section class="paper" data-page="1">
      <div class="content">
        <h1>قرارداد قرض الحسنه</h1>
        <p><!-- متن صفحه اول قرارداد از فایل PDF در این قسمت قرار می‌گیرد. --></p>
      </div>
      <div class="signatures" aria-label="امضاها">
        <div>امضای قرض‌دهنده</div>
        <div>امضای قرض‌گیرنده</div>
        <div>امضای شهود</div>
      </div>
      <div class="page-number">۱</div>
    </section>
    <section class="paper" data-page="2"><div class="content"><!-- محتوای صفحه دوم قرارداد --></div><div class="page-number">۲</div></section>
    <section class="paper" data-page="3"><div class="content"><!-- محتوای صفحه سوم قرارداد --></div><div class="page-number">۳</div></section>
    <section class="paper" data-page="4"><div class="content"><!-- محتوای صفحه چهارم قرارداد --></div><div class="page-number">۴</div></section>
    <section class="paper" data-page="5"><div class="content"><!-- محتوای صفحه پنجم قرارداد --></div><div class="page-number">۵</div></section>
    <section class="paper" data-page="6"><div class="content"><!-- محتوای صفحه ششم قرارداد --></div><div class="page-number">۶</div></section>
    <section class="paper" data-page="7"><div class="content"><!-- محتوای صفحه هفتم قرارداد --></div><div class="page-number">۷</div></section>
    <section class="paper" data-page="8"><div class="content"><!-- محتوای صفحه هشتم قرارداد --></div><div class="page-number">۸</div></section>
    <section class="paper" data-page="9"><div class="content"><!-- محتوای صفحه نهم قرارداد --></div><div class="page-number">۹</div></section>
  </main>
</body>
</html>
